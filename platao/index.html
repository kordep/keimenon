<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keimenon.org · Platão · A República · v0.1.0</title>
<link rel="stylesheet" href="keimenon-design.css"><link rel="stylesheet" href="keimenon-reader.css">
</head><body class="reading work-reader">
<header><h1>keimenon.org <span class="betaflag">beta · Platão</span></h1><button id="cfgToggle" data-i18n="api"></button><button id="commentsBackBtn" data-i18n="back"></button><select id="uiLang" aria-label="Interface language"><option value="pt">PT</option><option value="en">EN</option><option value="it">IT</option></select></header>
<main class="wrap">
<section id="reader">
  <div id="editBar">
    <div class="reader-nav"><span class="reader-label" data-i18n="authorWork"></span><span id="readerWork" class="reader-work"></span><label for="bookSelect" data-i18n="book"></label><select id="bookSelect"></select><label for="refInput">Stephanus</label><form id="refForm"><input id="refInput" type="text" placeholder="327, 327a, 557a" aria-label="Stephanus"><button data-i18n="go"></button></form></div>
    <div class="reader-translations"><span class="reader-label" data-i18n="translation"></span><span class="srcpills"><button id="readSrc-shorey">Shorey · Loeb</button><button id="readSrc-jowett">Jowett</button><button id="readSrc-vegetti">Vegetti</button><button id="personalBtn" data-i18n="myPassages"></button></span><div class="translation-add"><button id="addTransBtn" data-i18n="addTranslation"></button><div id="secondPicker" class="second-picker"><button data-source="shorey">Shorey · Loeb</button><button data-source="jowett">Jowett</button><button data-source="vegetti">Vegetti</button></div></div></div>
    <div class="reader-tools"><button id="importBtn" data-i18n="import"></button><button id="booksBtn" data-i18n="books"></button><button id="notesBtn" data-i18n="comments"></button><span class="reader-count" id="columnCount"></span></div>
  </div>
  <p class="status" id="readerStatus" role="status" aria-live="polite"></p>
  <div class="passage-heading"><h2 id="passageTitle"></h2><p id="passageMeta"></p></div>
  <nav id="sectionNav" class="section-nav" aria-label="Stephanus"></nav>
  <div class="cols" id="compare">
    <article class="textcol"><div class="col-head"><h3 id="originalHead"></h3><button id="translitBtn"></button></div><div class="grk" id="origRender"></div><div class="column-provenance" id="origProvenance"></div></article>
    <article class="textcol"><div class="col-head"><h3 id="transHead"></h3><button class="remove-trans" id="removePrimaryTrans">×</button></div><div class="eng" id="transRender"></div><div class="column-provenance" id="transProvenance"></div></article>
    <article class="textcol" id="trans2Col" hidden><div class="col-head"><h3 id="trans2Head"></h3><button class="remove-trans" id="removeSecondTrans">×</button></div><div class="eng" id="trans2Render"></div><div class="column-provenance" id="trans2Provenance"></div></article>
  </div>
  <nav class="page-nav"><button id="prevPage" data-i18n="previous"></button><span id="pageCount" class="small"></span><button id="nextPage" data-i18n="next"></button></nav>
  <p class="small reading-help" data-i18n="selectHelp"></p>
  <section class="result" id="result" aria-labelledby="resultTitle"><button class="analysis-close" id="closeAnalysisBtn">×</button><div class="top"><h3 id="resultTitle" class="result-heading"></h3><span id="resultGloss" class="gloss"></span></div><div class="body"><div><p class="status" id="analysisStatus" role="status" aria-live="polite"></p><div id="analysisContent" hidden><h4 data-i18n="meaning"></h4><p id="meaning"></p><h4 data-i18n="choice"></h4><p id="choice"></p><h4 data-i18n="stakes"></h4><div class="stakes" id="stakes"></div><p class="small" data-i18n="aiWarning"></p></div><p><a id="dictionaryLink" target="_blank" rel="noopener noreferrer">Wiktionary ↗</a></p><button id="analyzeBtn" data-i18n="analyze"></button></div><div><div id="alternativesBox" hidden><h4 data-i18n="alternatives"></h4><table class="alternatives-table"><thead><tr><th data-i18n="source"></th><th data-i18n="wording"></th><th data-i18n="effect"></th></tr></thead><tbody id="alternatives"></tbody></table></div><div class="usernote"><h4 data-i18n="yourComment"></h4><textarea id="userNote" rows="5"></textarea><div class="notefoot"><span id="noteStatus" class="small" role="status"></span><button id="noteSaveBtn" data-i18n="saveComment"></button></div></div></div></div></section>
  <section class="passage-comments"><h3 data-i18n="passageComments"></h3><details class="comment-group" id="myPassageComments"><summary><span data-i18n="myComments"></span> <span id="commentsCount"></span></summary><div id="passageCommentsList" class="comment-group-body"></div></details><div class="community-comments"><h4 data-i18n="community"></h4><p class="small" data-i18n="communityPending"></p></div></section>
  <details class="source-notes"><summary data-i18n="sources"></summary><p class="small" data-i18n="sourcesInfo"></p><a href="SOURCES.md" data-i18n="sourceDetails"></a> · <a href="sources/GUTENBERG-LICENSE.txt">Project Gutenberg License</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a> · <a href="sources/PERSEUS-LICENSE-README.md">Perseus</a> · <a href="PERSEUS-MODIFICATIONS.md">Perseus · dataset</a></details>
</section>
<section class="card" id="notesPanel" hidden><h2 data-i18n="savedComments"></h2><p class="small" data-i18n="localNotes"></p><input id="noteSearch" type="search"><div class="note-actions"><button id="notesExport" data-i18n="exportNotes"></button><button id="notesImport" data-i18n="importNotes"></button><input id="notesFile" type="file" accept="application/json,.json" hidden></div><div id="notesList"></div></section>
</main>
<dialog id="apiDialog"><div class="dialog-head"><h2 data-i18n="api"></h2><button data-close="apiDialog" data-i18n="close"></button></div><p class="small" data-i18n="apiPrivacy"></p><label for="provider" data-i18n="provider"></label><select id="provider"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="openrouter">OpenRouter</option></select><label for="model" data-i18n="model"></label><input id="model" type="text" value="gpt-4o-mini"><label for="apikey" data-i18n="key"></label><input id="apikey" type="password" autocomplete="off" placeholder="sk-…"><button data-close="apiDialog" data-i18n="apply"></button></dialog>
<dialog id="importDialog"><div class="dialog-head"><h2 data-i18n="import"></h2><button data-close="importDialog" data-i18n="close"></button></div><p class="small" data-i18n="importHelp"></p><label for="importName" data-i18n="name"></label><input id="importName" type="text"><label for="importRef">Stephanus</label><input id="importRef" type="text" placeholder="557a"><label for="importText" data-i18n="excerpt"></label><textarea id="importText" rows="9"></textarea><p id="importStatus" class="status" role="status"></p><button id="importApply" data-i18n="saveCompare"></button></dialog>
<dialog id="personalDialog"><div class="dialog-head"><h2 data-i18n="myPassages"></h2><button data-close="personalDialog" data-i18n="close"></button></div><div id="personalList"></div></dialog>
<footer class="site-footer"><span class="brand">keimenon.org</span><span data-i18n="localFooter"></span></footer>
<script src="republic-data.js"></script><script src="keimenon-language.js"></script><script src="keimenon-books.js"></script><script src="keimenon-reader.js"></script>
</body></html>
